[build]
  base = "apps/dashboard"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"

[[redirects]]
  from = "/oauth/success"
  to = "/oauth/success.html"
  status = 200

[[redirects]]
  from = "/oauth/error"
  to = "/oauth/error.html"
  status = 200

[[redirects]]
  from = "/oauth/authorize"
  to = "/.netlify/functions/oauth-authorize"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
